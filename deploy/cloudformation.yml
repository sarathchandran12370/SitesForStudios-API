AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SitesForStudios production stack (ap-south-1). UI on S3 + CloudFront, API on one EC2 instance
  behind the same CloudFront distribution (/api/*), RDS PostgreSQL, S3 media bucket, secrets,
  and GitHub OIDC deploy roles for the SitesForStudios-UI and SitesForStudios-API repos.
  MongoDB runs on MongoDB Atlas (pass its connection string).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Network }
        Parameters: [VpcId, SubnetIds, CloudFrontPrefixListId]
      - Label: { default: Sizing }
        Parameters: [InstanceType, DbInstanceClass, DbAllocatedStorage]
      - Label: { default: Application }
        Parameters: [AdminEmail, MongoUrl, FaceProvider, RazorpayKeyId, RazorpayKeySecret, RazorpayWebhookSecret]
      - Label: { default: GitHub deployments }
        Parameters: [GitHubOwner, ApiRepo, UiRepo, CreateGitHubOidcProvider]

Parameters:
  AppName:
    Type: String
    Default: sitesforstudios
    AllowedPattern: '[a-z0-9-]+'
    Description: Lowercase name used to prefix resources.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to use. The default VPC works.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two PUBLIC subnets in different availability zones of that VPC (the default VPC's
      subnets work). The API instance goes in the first one; RDS uses all of them.
  CloudFrontPrefixListId:
    Type: String
    Default: ''
    Description: >
      Optional. ID of the AWS-managed prefix list "com.amazonaws.global.cloudfront.origin-facing"
      in this region (VPC console > Managed prefix lists). If set, only CloudFront can reach the
      API port. If empty, the port is open but requests without the secret CloudFront header are refused.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large]
    Description: Graviton (ARM) instance for the Node API.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: PostgreSQL storage in GB.
  AdminEmail:
    Type: String
    Description: Email for the Super Admin login. Its password is generated into Secrets Manager.
  MongoUrl:
    Type: String
    NoEcho: true
    Description: MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster.xxxxx.mongodb.net/sitesforstudios
  FaceProvider:
    Type: String
    Default: rekognition
    AllowedValues: [rekognition, none]
  RazorpayKeyId:
    Type: String
    Default: ''
    NoEcho: true
  RazorpayKeySecret:
    Type: String
    Default: ''
    NoEcho: true
  RazorpayWebhookSecret:
    Type: String
    Default: ''
    NoEcho: true
  GitHubOwner:
    Type: String
    Default: sarathchandran12370
  ApiRepo:
    Type: String
    Default: SitesForStudios-API
  UiRepo:
    Type: String
    Default: SitesForStudios-UI
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if this AWS account already has the token.actions.githubusercontent.com identity provider.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 ARM image (leave as is).

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']
  HasPrefixList: !Not [!Equals [!Ref CloudFrontPrefixListId, '']]

Resources:
  # ---------------------------------------------------------------- Secrets
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AppName}/db'
      Description: PostgreSQL master credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"sfsadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AppName}/jwt'
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

  MediaSigningSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AppName}/media-signing'
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }

  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AppName}/origin-verify'
      Description: Header value CloudFront sends to the API
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }

  AdminPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AppName}/admin-password'
      Description: First Super Admin password (change it after first login)
      GenerateSecretString: { PasswordLength: 20, ExcludeCharacters: '"''`\/@ ' }

  ExternalSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AppName}/external'
      Description: MongoDB Atlas URL and Razorpay keys
      SecretString: !Sub '{"mongoUrl":"${MongoUrl}","razorpayKeyId":"${RazorpayKeyId}","razorpayKeySecret":"${RazorpayKeySecret}","razorpayWebhookSecret":"${RazorpayWebhookSecret}"}'

  # ---------------------------------------------------------------- Buckets
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${AppName}-media-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      CorsConfiguration:
        CorsRules:
          # Browsers upload straight to S3 with presigned URLs (the signature is the protection).
          - AllowedMethods: [PUT, GET, HEAD]
            AllowedOrigins: ['*']
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: raw-to-glacier-ir
            Status: Enabled
            TagFilters: [{ Key: class, Value: raw }]
            Transitions: [{ StorageClass: GLACIER_IR, TransitionInDays: 7 }]
          - Id: originals-to-ia
            Status: Enabled
            TagFilters: [{ Key: class, Value: original }]
            Transitions: [{ StorageClass: STANDARD_IA, TransitionInDays: 90 }]
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-ui-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  DeployBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-deploy-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-releases
            Status: Enabled
            ExpirationInDays: 30

  # ---------------------------------------------------------------- Network
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SitesForStudios API (port 4000 from CloudFront)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - !If
          - HasPrefixList
          - { IpProtocol: tcp, FromPort: 4000, ToPort: 4000, SourcePrefixListId: !Ref CloudFrontPrefixListId }
          - { IpProtocol: tcp, FromPort: 4000, ToPort: 4000, CidrIp: 0.0.0.0/0 }

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SitesForStudios PostgreSQL (from the API only)
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ApiSecurityGroup }

  ApiElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub '${AppName}-api' }]

  # ---------------------------------------------------------------- Database
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: SitesForStudios database subnets
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${AppName}-db'
      Engine: postgres
      EngineVersion: '16.9'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: sitesforstudios
      MasterUsername: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DbSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true
      AutoMinorVersionUpgrade: true

  # ---------------------------------------------------------------- API instance
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: app
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:PutObjectTagging]
                Resource: !Sub '${MediaBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MediaBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DeployBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - rekognition:CreateCollection
                  - rekognition:DeleteCollection
                  - rekognition:IndexFaces
                  - rekognition:SearchFaces
                  - rekognition:SearchFacesByImage
                Resource: !Sub 'arn:aws:rekognition:${AWS::Region}:${AWS::AccountId}:collection/sfs-event-*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DbSecret
                  - !Ref JwtSecret
                  - !Ref MediaSigningSecret
                  - !Ref OriginVerifySecret
                  - !Ref AdminPasswordSecret
                  - !Ref ExternalSecret

  ApiInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ApiRole]

  ApiInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ApiInstanceProfile
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      MetadataOptions: { HttpTokens: required }
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true }
      Tags: [{ Key: Name, Value: !Sub '${AppName}-api' }]
      # One-time setup: Node 24, a service user, the RDS CA bundle and the stack settings.
      # The app itself is installed by deploy/instance/deploy.sh on each deploy.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y jq tar xz
          cd /tmp
          NODE_TGZ=$(curl -fsSL https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt | grep 'linux-arm64.tar.xz' | awk '{print $2}')
          curl -fsSLO https://nodejs.org/dist/latest-v24.x/$NODE_TGZ
          curl -fsSL https://nodejs.org/dist/latest-v24.x/SHASUMS256.txt | grep " $NODE_TGZ" | sha256sum -c -
          tar -xJf $NODE_TGZ -C /usr/local --strip-components=1
          id sfs || useradd --system --create-home --shell /sbin/nologin sfs
          mkdir -p /opt/sitesforstudios/releases /etc/sitesforstudios
          curl -fsSL https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem -o /etc/sitesforstudios/rds-ca.pem
          cat > /etc/sitesforstudios/stack.env <<'EOF'
          AWS_REGION=${AWS::Region}
          APP_URL=https://${Distribution.DomainName}
          SITES_CNAME_TARGET=${Distribution.DomainName}
          S3_BUCKET=${MediaBucket}
          DB_HOST=${Database.Endpoint.Address}
          DB_PORT=${Database.Endpoint.Port}
          DB_NAME=sitesforstudios
          DB_SECRET_ARN=${DbSecret}
          JWT_SECRET_ARN=${JwtSecret}
          MEDIA_SECRET_ARN=${MediaSigningSecret}
          ORIGIN_SECRET_ARN=${OriginVerifySecret}
          ADMIN_PASSWORD_SECRET_ARN=${AdminPasswordSecret}
          EXTERNAL_SECRET_ARN=${ExternalSecret}
          ADMIN_EMAIL=${AdminEmail}
          FACE_PROVIDER=${FaceProvider}
          EOF
          sed -i 's/^ *//' /etc/sitesforstudios/stack.env
          chmod 600 /etc/sitesforstudios/stack.env

  ApiEipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ApiElasticIp.AllocationId
      InstanceId: !Ref ApiInstance

  # ---------------------------------------------------------------- CloudFront
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-ui'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Single-page app: send page routes (no file extension) to index.html. /api/* is not touched.
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AppName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig: { Comment: Serve index.html for app routes, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          var last = req.uri.split('/').pop();
          if (last.indexOf('.') === -1) req.uri = '/index.html';
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SitesForStudios app, studio websites and API
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: ui
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: api
            # Public DNS name of the Elastic IP, e.g. ec2-13-200-1-2.ap-south-1.compute.amazonaws.com
            DomainName: !Sub
              - 'ec2-${Dashed}.${AWS::Region}.compute.amazonaws.com'
              - Dashed: !Join ['-', !Split ['.', !Ref ApiElasticIp]]
            CustomOriginConfig:
              HTTPPort: 4000
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginVerifySecret}}}'
        DefaultCacheBehavior:
          TargetOriginId: ui
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # ---------------------------------------------------------------- GitHub OIDC deploy roles
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  ApiDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-github-api-deploy'
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${ApiRepo}:environment:production'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${DeployBucket.Arn}/api/*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${ApiInstance}'
              - Effect: Allow
                Action: [ssm:GetCommandInvocation, ssm:ListCommandInvocations]
                Resource: '*'

  UiDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AppName}-github-ui-deploy'
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubOwner}/${UiRepo}:environment:production'
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:GetObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  AppUrl:
    Description: Open this in a browser once both repos have deployed.
    Value: !Sub 'https://${Distribution.DomainName}'
  CloudFrontDomain:
    Description: Add this to the UI repo variable APP_HOSTS when you use your own domain; studios CNAME their domains here.
    Value: !GetAtt Distribution.DomainName
  DistributionId:
    Description: UI repo variable CLOUDFRONT_DISTRIBUTION_ID
    Value: !Ref Distribution
  SiteBucketName:
    Description: UI repo variable UI_BUCKET
    Value: !Ref SiteBucket
  UiDeployRoleArn:
    Description: UI repo variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt UiDeployRole.Arn
  DeployBucketName:
    Description: API repo variable DEPLOY_BUCKET
    Value: !Ref DeployBucket
  ApiInstanceId:
    Description: API repo variable API_INSTANCE_ID
    Value: !Ref ApiInstance
  ApiDeployRoleArn:
    Description: API repo variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt ApiDeployRole.Arn
  ApiPublicIp:
    Description: Add this IP to the MongoDB Atlas network access list.
    Value: !Ref ApiElasticIp
  MediaBucketName:
    Value: !Ref MediaBucket
  AdminPasswordSecretName:
    Description: Secrets Manager secret holding the first Super Admin password.
    Value: !Sub '${AppName}/admin-password'
