name: API CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sitesforstudios
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sitesforstudios
      MONGO_URL: mongodb://localhost:27017/sitesforstudios
      JWT_SECRET: ci-jwt-secret
      MEDIA_SIGNING_SECRET: ci-media-secret
      STORAGE_DRIVER: local
      FACE_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Migrate and seed demo data
        run: |
          node src/db/migrate.js
          node src/db/seed.js --demo
      - name: Smoke test
        run: |
          node src/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4000/api/health && break; sleep 1; done
          curl -fs http://localhost:4000/api/sites/arjun-photography > /dev/null
          curl -fs -c jar -H 'Content-Type: application/json' \
            -d '{"email":"couple@demo.local","password":"Demo!2026"}' http://localhost:4000/api/auth/login > /dev/null
          test "$(curl -fs -b jar http://localhost:4000/api/portal/events | jq length)" -ge 1
          echo "smoke test passed"
      - if: failure()
        run: cat server.log || true

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      API_INSTANCE_ID: ${{ vars.API_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload release
        run: |
          git archive --format=tar.gz -o release.tgz HEAD
          aws s3 cp release.tgz "s3://$DEPLOY_BUCKET/api/$GITHUB_SHA.tgz"
      - name: Install on the instance (SSM)
        run: |
          KEY="s3://$DEPLOY_BUCKET/api/$GITHUB_SHA.tgz"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$API_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $GITHUB_SHA" \
            --timeout-seconds 900 \
            --parameters "commands=[\"set -e\",\"aws s3 cp $KEY /tmp/sfs-release.tgz\",\"rm -rf /tmp/sfs-deploy && mkdir -p /tmp/sfs-deploy\",\"tar -xzf /tmp/sfs-release.tgz -C /tmp/sfs-deploy deploy/instance\",\"bash /tmp/sfs-deploy/deploy/instance/deploy.sh /tmp/sfs-release.tgz\"]" \
            --query Command.CommandId --output text)
          echo "SSM command $CMD_ID"
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$API_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$API_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text | tail -n 60
          echo "Status: $STATUS"
          test "$STATUS" = "Success"
